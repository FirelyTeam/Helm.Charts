apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "firely-auth.fullname" . }}-test-connection"
  labels:
    {{- include "firely-auth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- if not (kindIs "invalid" .Values.serviceAccount.automountServiceAccountToken) }}
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  {{- end }}
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "firely-auth.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
